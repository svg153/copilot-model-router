name: Tests

# The suite is plain `node --test` (no dependencies). Running it on every push
# and PR is the cheapest gate against regressions in routing.mjs merge/normalize
# logic, which silently changes which model every Copilot session uses.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run test suite
        # Bash expands the glob, so this works identically on Node 20 (no glob
        # support in --test args) and Node 22 (positional dir args are not
        # expanded since v21). Matches the command documented in README.md.
        run: node --test model-router/test/*.test.mjs
