name: Refresh model data

# Keeps data/models-enriched.json current. The canvas downloads that snapshot,
# so refreshing it here is what keeps an installed extension's vendor, price and
# benchmark columns up to date without shipping a new extension version.
#
# The script keeps the previous `generatedAt` when nothing else changed, so a
# week with no upstream movement produces no diff and no commit.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-data.mjs"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-model-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build snapshot
        run: node scripts/build-data.mjs

      - name: Commit when it changed
        run: |
          if git diff --quiet -- model-router/data/models-enriched.json; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-router/data/models-enriched.json
          git commit -m "chore: refresh model data snapshot"
          git push
